<!DOCTYPE html>
<html>

    <head>
        <title>Lysningen</title>
        <link rel="stylesheet" href="lysningen.css">
    </head>

    <body>
        <div class="container">

            <div class="image_container">

                <!-- Image Map Generated by http://www.image-map.net/ -->
                <img 
                src="Assets/Lysningen pixel.png" 
                usemap="#image-map"
                class="responsive-img">

                <map name="image-map">
                    <area target="_blank" alt="My Youtube" title="My Youtube" href="https://www.youtube.com/@ingridmelvold" coords="1,360,1,147,214,67,250,80,257,247,282,271,284,286,35,400" shape="poly"> 
                    <!-- Bruk denne om jeg heller skal lage popupvindu;
                    onclick="openPopup
                    ('Welcome to the Forest Café<3', 'Coffee/smoothies/cakes/snacks', 'Assets/Potion.png'); return false;">
                    -->

                    <area target="_blank" alt="Forest Café" title="Forest Café" coords="320,199,319,110,340,87,362,87,364,68,429,0,444,0,480,0,538,48,527,59,526,82,534,90,537,181,503,213,414,214,412,200" shape="poly" onclick="openPopup
                    ('Welcome to the Forest Café', 'Coffee/smoothies/cakes/snacks', 'Assets/Potion.png'); return false;">
                    
                    <area target="_blank" alt="Crochet Patterns" title="Crochet Patterns" href="https://www.strikkoteket.no/min-butikk/ingridshekledesign/" coords="835,4,813,134,788,191,771,252,741,318,714,380,706,390,707,401,750,420,854,392,946,362,968,231,969,170,978,53,1017,36,1031,28,1029,60,1015,65,1014,124,1138,121,1137,60,1127,59,1126,12,1143,4" shape="poly"> 

                    <area target="_blank" alt="Moshlings" title="Moshlings" href="https://static.wikia.nocookie.net/moshimonstersmoshlingsyay/images/a/ae/Moshlingzoo.jpg/revision/latest?cb=20110905075445" coords="978,365,1125,410,1197,373,1196,282,1167,217,1086,236,1042,259,1017,282" shape="poly">
                    <!-- Bruk denne om jeg heller skal lage popupvindu:
                     onclick="openPopup
                    ('Knapp 3', 'Dette er tekst for popup nummer 3'); return false;">
                    -->
                </map>
            </div>
        </div>
        <script src="https://unpkg.com/image-map-resizer/js/imageMapResizer.min.js"></script>

        <script>
            imageMapResize();
        </script>

        <!-- Popup HELT NEDERST -->
        <div id="popup" class="popup">
            <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>

            <h2 id="popup-title"></h2>
            <p id="popup-text"></p>
            <img id="popup-image" src="" alt="Popup bilde" style="max-width: 100%; height: auto;">
            </div>
        </div>



        <script>
            function openPopup(title, text, imageSrc) {

            document.getElementById("popup-title").innerText = title;
            document.getElementById("popup-text").innerText = text;
            
            const popupImage = document.getElementById("popup-image");
        
                if (imageSrc) {
                    popupImage.src = imageSrc;
                    popupImage.style.display = "block";
                } else {
                    popupImage.src = '';
                    popupImage.style.display = "none";
                }
            
            
            document.getElementById("popup").style.display = "block";
        }

            function closePopup() {
            document.getElementById("popup").style.display = "none";
            }
        </script>
    </body>

</html>
